<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>归档箱 · 识海 · 苏苏侠</title>
<style>
:root{--ink:#cfe2f5;--dim:#5f7d99;--line:rgba(120,180,240,.1);--gold:#c8b282}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 800px at 50% -10%,#0a1220 0%,#03060b 62%,#010306 100%);
  color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

#wrap{max-width:780px;margin:0 auto;padding:56px 28px 90px}

/* 头 */
h1{margin:0 0 6px;font-size:20px;font-weight:500;letter-spacing:.34em;color:#f0ead9;
  font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;
  text-shadow:0 0 34px rgba(200,178,130,.22)}
.sub{font-size:10.5px;letter-spacing:.24em;color:#3f6386;margin-bottom:34px}
.sub b{color:#6d8aa8;font-weight:400}

/* 统计 */
.stats{display:flex;gap:26px;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.stats .st{display:flex;flex-direction:column;gap:5px}
.stats .st .n{font-size:19px;color:var(--gold);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stats .st .k{font-size:9px;letter-spacing:.26em;color:#3f6386}

/* 列表 */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:9px;
  border-bottom:1px solid rgba(120,180,240,.05);
  transition:background .16s}
.row:hover{background:rgba(40,80,120,.1)}
.row .dot{width:4px;height:4px;border-radius:50%;background:#3f6f9a;flex:none}
.row .dot.fad{background:#5a4a6a}
.row .main{flex:1;min-width:0}
.row .t{font-size:12.5px;color:#a8c0d6;line-height:1.5;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:9.5px;color:#36536e;letter-spacing:.1em;margin-top:3px}
.row .m .cl{color:#4f7399}
.row .age{font-size:10px;color:#2f4a66;flex:none;width:52px;text-align:right;
  font-variant-numeric:tabular-nums}
.row button{background:transparent;border:1px solid rgba(120,180,240,.18);color:#7fa8c8;
  border-radius:7px;padding:5px 13px;font-size:10.5px;cursor:pointer;font-family:inherit;
  flex:none;transition:all .16s;letter-spacing:.05em}
.row button:hover{border-color:rgba(130,210,240,.5);color:#d6f4ff;background:rgba(30,70,100,.42)}
.row button:active{transform:translateY(1px)}

/* 空态 */
.empty{padding:70px 20px;text-align:center;color:#2f4a66;font-size:12px;line-height:2.2;
  letter-spacing:.1em}

/* 底 */
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 28px;
  background:linear-gradient(180deg,transparent,rgba(2,5,10,.94) 40%);
  display:flex;align-items:center;gap:14px;max-width:780px;margin:0 auto}
.foot .note{font-size:10px;color:#2f4a66;letter-spacing:.06em;flex:1}
.foot button{background:rgba(16,32,48,.6);border:1px solid rgba(120,180,240,.16);
  color:#8fb3d4;border-radius:8px;padding:8px 18px;font-size:11px;cursor:pointer;
  font-family:inherit;letter-spacing:.08em;transition:all .16s}
.foot button:hover{background:rgba(24,52,74,.82);border-color:rgba(120,180,240,.4);color:#d9efff}
.foot a{font-size:10.5px;color:#4f7399;text-decoration:none;letter-spacing:.1em;
  border-bottom:1px solid rgba(120,180,240,.16);padding-bottom:1px}
.foot a:hover{color:#8fc0e6;border-color:rgba(120,180,240,.4)}

/* 提示条 */
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
  background:rgba(10,20,32,.96);border:1px solid rgba(120,180,240,.24);border-radius:9px;
  padding:9px 18px;font-size:11.5px;color:#bcd8f0;opacity:0;transition:opacity .24s;
  pointer-events:none;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <h1>归档箱</h1><div style="font-size:10px;letter-spacing:.18em;color:#4a6683;margin-top:5px">苏苏侠</div>
  <div class="sub">收起来的东西 <b>·</b> 不是删除，随时能捞回</div>

  <div class="stats">
    <div class="st"><span class="n" id="sCount">—</span><span class="k">已收</span></div>
    <div class="st"><span class="n" id="sOld">—</span><span class="k">最久</span></div>
    <div class="st"><span class="n" id="sFade">—</span><span class="k">快没了</span></div>
  </div>

  <div class="list" id="list"><div class="empty">在读……</div></div>
</div>

<div class="foot">
  <span class="note" id="note">归档判据：久未碰 + 低重要度 + 亮度低 + 可遗忘类型</span>
  <a href="/consciousness" id="back">← 回识海</a>
  <button id="sweep">扫一遍</button>
</div>

<div id="toast"></div>

<script>
const SEA = (function(){
  try { return new URL(location.href).searchParams.get('id') || 'main' } catch(e) { return 'main' }
})();

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2200);
}

function readJson(r){
  if(!r || !r.ok) throw new Error('HTTP ' + (r ? r.status : '?'));
  return r.text().then(t => {
    if(!t) throw new Error('空响应');
    return JSON.parse(t);
  });
}

function render(j){
  const list = document.getElementById('list');
  const items = (j && j.items) || [];
  document.getElementById('sCount').textContent = items.length;
  const old = items.reduce((m, x) => Math.max(m, x.daysAgo || 0), 0);
  document.getElementById('sOld').textContent = old ? old + ' 天' : '—';
  const fade = items.filter(x => x.r < 0.32).length;
  document.getElementById('sFade').textContent = fade;

  if(!items.length){
    list.innerHTML = '<div class="empty">箱子里是空的。<br>还没什么淡到需要收起来。</div>';
    return;
  }

  list.innerHTML = items.map(x => {
    const faded = x.r < 0.32;
    return '<div class="row" data-id="' + x.id + '">'
      + '<span class="dot' + (faded ? ' fad' : '') + '"></span>'
      + '<div class="main">'
      +   '<div class="t">' + String(x.title || '（无标题）').replace(/</g,'&lt;') + '</div>'
      +   '<div class="m"><span class="cl">' + (x.clarity || '—') + ' ' + Number(x.r).toFixed(2) + '</span>'
      +     ' · ' + (x.layer || 'experience')
      +     (x.reason ? ' · ' + String(x.reason).replace(/</g,'&lt;') : '') + '</div>'
      + '</div>'
      + '<span class="age">' + (x.daysAgo ? x.daysAgo + ' 天' : '刚收') + '</span>'
      + '<button data-act="restore">捞回</button>'
      + '</div>';
  }).join('');

  list.querySelectorAll('.row button').forEach(btn => {
    btn.addEventListener('click', function(){
      const id = Number(btn.closest('.row').getAttribute('data-id'));
      btn.disabled = true;
      btn.textContent = '…';
      fetch('/consciousness/archive-data?action=restore&id=' + id + '&sea=' + encodeURIComponent(SEA), { cache:'no-store' })
        .then(readJson)
        .then(j2 => {
          if(j2 && j2.ok){ toast('捞回来了：' + (j2.title || '#' + id)); load(); }
          else { toast('没捞成：' + ((j2 && j2.error) || '未知')); btn.disabled = false; btn.textContent = '捞回'; }
        })
        .catch(e => { toast('没捞成：' + (e && e.message || '未知')); btn.disabled = false; btn.textContent = '捞回'; });
    });
  });
}

function load(){
  fetch('/consciousness/archive-data?action=list&sea=' + encodeURIComponent(SEA), { cache:'no-store' })
    .then(readJson)
    .then(j => { if(j && j.ok) render(j); else showEmpty((j && j.error) || '读不到'); })
    .catch(e => showEmpty(e && e.message || '接口没起'));
}

function showEmpty(msg){
  document.getElementById('list').innerHTML =
    '<div class="empty">读不出来：' + String(msg).replace(/</g,'&lt;') + '<br>（接口没起？重启一次 DSH）</div>';
}

document.getElementById('sweep').addEventListener('click', function(){
  const b = this;
  b.disabled = true; b.textContent = '扫……';
  fetch('/consciousness/archive-data?action=sweep&sea=' + encodeURIComponent(SEA), { cache:'no-store' })
    .then(readJson)
    .then(j => {
      b.disabled = false; b.textContent = '扫一遍';
      if(j && j.ok){ toast(j.moved ? ('又收了 ' + j.moved + ' 条') : '没有该收的'); load(); }
      else toast('扫不了：' + ((j && j.error) || '未知'));
    })
    .catch(e => { b.disabled = false; b.textContent = '扫一遍'; toast('扫不了：' + (e && e.message || '未知')); });
});

document.getElementById('back').addEventListener('click', function(){
  // 从哪来回哪去，没历史就回主界面
  try { if(history.length > 1){ history.back(); return } } catch(e){}
  location.href = '/consciousness?id=' + encodeURIComponent(SEA);
});

load();
</script>
</body>
</html>
