<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>聚合</title>
<style>
  html,body{margin:0;height:100%;background:#03050a;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
  canvas{display:block}
  #h{position:fixed;left:44px;top:38px;z-index:2;pointer-events:none}
  #h h1{margin:0;font-size:26px;color:#c8b282;font-weight:600;letter-spacing:.1em}
  #h p{margin:8px 0 0;font-size:13px;color:#5b82ac}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="h"><h1>聚合</h1><p>冷掉的记忆攒够一撮，会自己收成一团，点一下才散开。</p></div>
<script src="/sea-demo/lib.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=2;
let W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

const SIZE=18, N=12;
const nodes=[];
let seed=7;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
for(let i=0;i<N;i++){
  const a=rnd()*Math.PI*2, d=0.55+rnd()*0.45;
  const kind = i%3===0?'feeling':'fact';
  nodes.push({a:a, d:d, st:0.46+rnd()*0.18, kind:kind,
    v:vectorize(SEA_COLOR[kind], SIZE, 500+i*37, kind)});
}

function frame(ts){
  if(!frame.t0) frame.t0=ts;
  const t=((ts-frame.t0)/1000)%12;
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H*0.46;
  const R=Math.min(W,H)*0.30;

  let pull;
  if(t<2) pull=0;
  else if(t<5) pull=(t-2)/3;
  else if(t<8) pull=1;
  else pull=0;

  if(pull>0.55){
    const a=(pull-0.55)*0.55;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.5);
    g.addColorStop(0,'rgba(150,168,205,'+(0.22*a)+')');
    g.addColorStop(.45,'rgba(95,115,165,'+(0.10*a)+')');
    g.addColorStop(1,'rgba(60,80,120,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*0.5,0,7); ctx.fill();
    for(let i=0;i<44;i++){
      const ang=i*2.399+t*0.25, rr=(i/44)*R*0.46;
      ctx.fillStyle='rgba(205,222,245,'+(0.4*a)+')';
      ctx.fillRect(cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr*0.85, 1.3, 1.3);
    }
  }

  const k=Math.min(W,H)/900*1.25;
  for(const n of nodes){
    const ox=cx+Math.cos(n.a)*R*n.d*1.7;
    const oy=cy+Math.sin(n.a)*R*n.d*1.35;
    const ix=cx+Math.cos(n.a)*R*0.14;
    const iy=cy+Math.sin(n.a)*R*0.11;
    const x=ox+(ix-ox)*pull, y=oy+(iy-oy)*pull;
    drawNeuron(ctx,x,y,k*(1-pull*0.35),n.v,{st:n.st,alpha:0.6,aura:'#8f7fc4'});
  }

  ctx.textAlign='center';
  ctx.font='15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(200,220,244,.8)';
  ctx.fillText(pull>0.85?'收成一团了':(pull>0.1?'正在往一处收':'散着'), W/2, H-84);

  requestAnimationFrame(frame);
}
setTimeout(function(){requestAnimationFrame(frame);}, 2500);
</script>
</body></html>
