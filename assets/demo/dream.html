<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>梦线</title>
<style>
  html,body{margin:0;height:100%;background:#03050a;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
  canvas{display:block}
  #h{position:fixed;left:44px;top:38px;z-index:2;pointer-events:none}
  #h h1{margin:0;font-size:26px;color:#c8b282;font-weight:600;letter-spacing:.1em}
  #h p{margin:8px 0 0;font-size:13px;color:#5b82ac}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="h"><h1>梦线</h1><p>两条八竿子打不着的记忆，忽然连一下，十几秒又断了。</p></div>
<script src="/sea-demo/lib.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=2;
let W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();
const SIZE=24;

const vA=vectorize(SEA_COLOR.fact, SIZE, 311, 'fact');
const vB=vectorize(SEA_COLOR.feeling, SIZE, 902, 'feeling');

function frame(ts){
  if(!frame.t0) frame.t0=ts;
  const t=((ts-frame.t0)/1000)%14;
  ctx.clearRect(0,0,W,H);
  const cy=H*0.46, gap=Math.min(W*0.40,560);
  const ax=W/2-gap/2, bx=W/2+gap/2, k=Math.min(W,H)/900*1.35;

  drawNeuron(ctx,ax,cy,k,vA,{st:1,alpha:1,aura:'#e0b070'});
  drawNeuron(ctx,bx,cy,k,vB,{st:1,alpha:1,aura:'#8f7fc4'});

  let draw=0, alpha=0, brk=0;
  if(t>=2 && t<4){ draw=(t-2)/2; alpha=0.6*draw; }
  else if(t>=4 && t<9){ draw=1; alpha=0.55+0.35*Math.abs(Math.sin((t-4)*3.1)); }
  else if(t>=9 && t<11){ draw=1; brk=(t-9)/2; alpha=0.5*(1-brk); }

  if(draw>0 && alpha>0.02){
    const mx=(ax+bx)/2, my=cy-Math.min(W,H)*0.11;
    ctx.setLineDash([2,8]);
    ctx.strokeStyle='rgba(168,140,232,'+alpha.toFixed(3)+')';
    ctx.lineWidth=2;
    if(brk<=0){
      ctx.beginPath(); ctx.moveTo(ax,cy); ctx.quadraticCurveTo(mx,my,bx,cy); ctx.stroke();
    }else{
      const seg=1-brk;
      for(const [u0,u1] of [[0,0.5*seg],[1-0.5*seg,1]]){
        ctx.beginPath();
        for(let i=0;i<=24;i++){
          const u=u0+(u1-u0)*(i/24);
          const x=(1-u)*(1-u)*ax+2*(1-u)*u*mx+u*u*bx;
          const y=(1-u)*(1-u)*cy+2*(1-u)*u*my+u*u*cy;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  ctx.textAlign='center'; ctx.font='15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(200,220,244,.8)';
  const msg=t<2?'两条不相干的记忆':(t<4?'忽然连上了':(t<9?'闪了几下':(t<11?'断了':'又忘了')));
  ctx.fillText(msg, W/2, H-90);
  requestAnimationFrame(frame);
}
setTimeout(function(){requestAnimationFrame(frame);}, 2500);
</script>
</body></html>
