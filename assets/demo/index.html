<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>识海 · 功能演示</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow-x:hidden;
    font-family:"Microsoft YaHei",sans-serif;color:#cfe2f6}
  .wrap{max-width:900px;margin:0 auto;padding:70px 40px 80px}
  h1{margin:0;font-size:34px;color:#c8b282;font-weight:600;letter-spacing:.12em}
  .lead{margin:14px 0 50px;font-size:14px;color:#5b82ac;letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  a.card{display:block;padding:22px 20px;border:1px solid rgba(120,180,240,.16);
    border-radius:12px;background:rgba(10,18,28,.6);text-decoration:none;color:inherit;
    transition:border-color .2s,background .2s,transform .2s}
  a.card:hover{border-color:rgba(120,180,240,.45);background:rgba(14,24,38,.9);transform:translateY(-2px)}
  .n{font-size:11px;color:#41586f;letter-spacing:.14em}
  .t{margin-top:8px;font-size:19px;color:#e6f0fa}
  .d{margin-top:8px;font-size:12px;color:#5b82ac;line-height:1.7}
</style></head>
<body><div class="wrap">
  <h1>识海</h1>
  <p class="lead">一条记忆，一个神经元。下面每个机制单独一页，只演它自己。</p>
  <div class="grid">
    <a class="card" href="/sea-demo/decay"><div class="n">01</div><div class="t">衰减</div><div class="d">越久没碰越暗，最后只剩一个点，但不删。</div></a>
    <a class="card" href="/sea-demo/cluster"><div class="n">02</div><div class="t">聚合</div><div class="d">冷掉的攒够了，会自己收成一团星云。</div></a>
    <a class="card" href="/sea-demo/burial"><div class="n">03</div><div class="t">葬礼</div><div class="d">删掉的不消失，沉到球心，变成一颗暗点。</div></a>
    <a class="card" href="/sea-demo/dream"><div class="n">04</div><div class="t">梦线</div><div class="d">两条不相干的记忆，硬连一下，十几秒就散。</div></a>
    <a class="card" href="/sea-demo/replay"><div class="n">05</div><div class="t">重放</div><div class="d">闲下来，按写进来的时间，把一段往事依次点亮。</div></a>
    <a class="card" href="/sea-demo/impulse"><div class="n">06</div><div class="t">冲动</div><div class="d">没人说话，它也在放电，一道光扫过去。</div></a>
    <a class="card" href="/sea-demo/polarity"><div class="n">07</div><div class="t">极性</div><div class="d">内核是分类，外面那圈光才是情绪。</div></a>
    <a class="card" href="/sea-demo/search"><div class="n">08</div><div class="t">搜索</div><div class="d">搜一句，相关的亮起来，连着的也一起亮。</div></a>
  </div>
</div></body></html>
