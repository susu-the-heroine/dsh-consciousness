<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>搜索</title>
<style>
  html,body{margin:0;height:100%;background:#03050a;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}
  canvas{display:block}
  #h{position:fixed;left:44px;top:38px;z-index:2;pointer-events:none}
  #h h1{margin:0;font-size:26px;color:#c8b282;font-weight:600;letter-spacing:.1em}
  #h p{margin:8px 0 0;font-size:13px;color:#5b82ac}
  #box{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:3;display:flex;gap:8px}
  #q{width:280px;padding:10px 13px;border-radius:8px;border:1px solid rgba(120,180,240,.3);
    background:rgba(6,12,20,.92);color:#cfe2f6;font:14px "Microsoft YaHei",sans-serif;outline:none}
  #go{padding:10px 18px;border-radius:8px;border:1px solid rgba(120,180,240,.3);
    background:rgba(120,180,240,.12);color:#cfe2f6;font:14px "Microsoft YaHei",sans-serif;cursor:pointer}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="box"><input id="q" placeholder="比如：争吵"><button id="go">唤起</button></div>
<div id="h"><h1>搜索</h1><p>搜一句，相关的亮起来，跟它连着的也一起亮。</p></div>
<script src="/sea-demo/lib.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=2;
let W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();
const SIZE=20;

const NODES=[
  {nx:-0.62, ny:-0.30, t:'那次争吵',     kind:'feeling'},
  {nx:-0.12, ny:-0.44, t:'后来和好了',   kind:'feeling'},
  {nx: 0.38, ny:-0.22, t:'谁也没道歉',   kind:'feeling'},
  {nx: 0.66, ny: 0.18, t:'第二天的早饭', kind:'fact'},
  {nx: 0.12, ny: 0.36, t:'说了一句重话', kind:'feeling'},
  {nx:-0.46, ny: 0.26, t:'那个人搬走了', kind:'fact'},
];
NODES.forEach(function(n,i){ n.v=vectorize(SEA_COLOR[n.kind], SIZE, 600+i*43, n.kind); });
const EDGES=[[0,1],[1,2],[0,4],[4,5],[2,3]];
let matched=new Set(), related=new Set(), rippleT=0;

function pos(i){
  const n=NODES[i], R=Math.min(W,H)*0.32;
  return {x:W/2+n.nx*R*1.55, y:H*0.44+n.ny*R*1.55};
}

document.getElementById('go').onclick=function(){
  const q=document.getElementById('q').value.trim();
  matched=new Set(); related=new Set();
  if(q){
    for(let i=0;i<NODES.length;i++){
      if(NODES[i].t.indexOf(q)>=0 || q.indexOf(NODES[i].t)>=0) matched.add(i);
    }
    for(const [a,b] of EDGES){
      if(matched.has(a)) related.add(b);
      if(matched.has(b)) related.add(a);
    }
    related.forEach(function(i){ if(matched.has(i)) related.delete(i); });
    rippleT=performance.now();
  }
};

function frame(ts){
  ctx.clearRect(0,0,W,H);
  const k=Math.min(W,H)/900*1.3;
  const now=performance.now();

  for(const [a,b] of EDGES){
    const pa=pos(a), pb=pos(b);
    const on=matched.has(a)&&matched.has(b);
    ctx.strokeStyle=on?'rgba(150,225,255,.55)':'rgba(70,120,175,.13)';
    ctx.lineWidth=on?1.6:0.8;
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  }

  for(let i=0;i<NODES.length;i++){
    const p=pos(i), n=NODES[i];
    let a=0.28;
    if(matched.has(i)) a=1; else if(related.has(i)) a=0.6;
    drawNeuron(ctx,p.x,p.y,k,n.v,{st:matched.has(i)?1:0.55, alpha:a,
      aura:n.kind==='fact'?'#79b8e8':'#e0b070', glow:matched.has(i)?1.8:1});
    ctx.textAlign='center';
    ctx.font=(matched.has(i)?'15px':'12px')+' "Microsoft YaHei",sans-serif';
    ctx.fillStyle=matched.has(i)?'rgba(240,250,255,.95)':'rgba(150,175,200,.45)';
    ctx.fillText(n.t, p.x, p.y+SIZE*k*3.2);
  }

  const el=(now-rippleT)/1000;
  if(rippleT && el<1.2 && matched.size){
    const p=pos(Array.from(matched)[0]);
    ctx.strokeStyle='rgba(150,220,255,'+(0.3*(1-el/1.2)).toFixed(3)+')';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(p.x,p.y,20+el*280,0,7); ctx.stroke();
  }
  requestAnimationFrame(frame);
}
setTimeout(function(){requestAnimationFrame(frame);}, 2500);
</script>
</body></html>
